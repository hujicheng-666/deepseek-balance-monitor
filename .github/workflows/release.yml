name: Release Packages

# 触发方式：
#   - 推送到 master → Windows + Linux 打包并上传构建产物（artifact）
#   - 推送 v* 标签（如 v2.0.0）→ 两个平台打包并自动发布 GitHub Release
#   - 手动在 Actions 页面点 "Run workflow" → 只上传构建产物（artifact）
on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      # installer.iss 引用简体中文语言文件，但 Inno Setup 官方安装包不含
      # 非官方翻译，需手动下载到 Languages 目录
      - name: Download ChineseSimplified.isl
        shell: powershell
        run: |
          $dst = 'C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl' -OutFile $dst

      - name: Build installer
        shell: powershell
        env:
          ISCC: 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
        run: .\build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe

  linux:
    name: Linux (.deb / .rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build packages
        run: bash ./packaging/make-linux-packages.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: release/*.deb
          if-no-files-found: error

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer-rpm
          path: release/*.rpm
          if-no-files-found: error

  # 仅在推送标签时运行：把两个平台的安装包挂到一个 GitHub Release 上
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
